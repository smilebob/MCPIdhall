[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-idhall"
version = "0.1.0"
description = "Serveur MCP (FastMCP) lecture/écriture pour l'API REST IDhall (Humanperf Software) avec authentification JWT par utilisateur."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/smilebob/MCPIdhall"
Issues = "https://github.com/smilebob/MCPIdhall/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
mcp-idhall = "mcp_idhall.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_idhall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
